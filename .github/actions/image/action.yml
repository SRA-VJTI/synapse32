name: Image
description: Pull the image published for these Dockerfile inputs, or build it from the BuildKit cache.

inputs:
  tag:
    description: Image reference, tagged by a hash of everything it is built from
    required: true
  context:
    description: Build context
    required: true
  file:
    description: Dockerfile
    required: true
  cache-scope:
    description: GitHub Actions cache scope for BuildKit
    required: true
  load:
    description: "'false' only fills the build cache, for the jobs that load the image after it"
    default: "true"

outputs:
  tag:
    description: The image reference, as given
    value: ${{ inputs.tag }}
  published:
    description: "'true' when the tag was already published"
    value: ${{ steps.published.outputs.published }}

runs:
  using: composite
  steps:
    - id: published
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        if docker manifest inspect "$TAG" > /dev/null 2>&1; then
          echo "published=true" >> "$GITHUB_OUTPUT"
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.published.outputs.published == 'true' && inputs.load == 'true'
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: docker pull "$TAG"

    - if: steps.published.outputs.published != 'true'
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - if: steps.published.outputs.published != 'true'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        tags: ${{ inputs.tag }}
        load: ${{ inputs.load == 'true' }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: ${{ inputs.load != 'true' && format('type=gha,mode=max,scope={0}', inputs.cache-scope) || '' }}
