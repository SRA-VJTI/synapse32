name: ISA Golden Image

on:
  push:
    branches: [main]
    paths:
      - ".github/isa/**"
      - ".github/workflows/isa-golden-image.yml"
      - "tests/requirements.txt"
      - "rtl/**"
      - "tests/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - ".github/isa/**"
      - ".github/workflows/isa-golden-image.yml"
      - "tests/requirements.txt"
      - "rtl/**"
      - "tests/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/synapse32-isa

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}-isa"
          echo "dockerfile=${image_name}:dockerfile-${{ hashFiles('.github/isa/Dockerfile', 'tests/requirements.txt') }}" >> "$GITHUB_OUTPUT"
          echo "immutable=${image_name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "linux=${image_name}:linux" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is a hash of the image's inputs, so a published image is reused
      # only when nothing it is built from has changed.
      - name: Pull matching ISA image
        id: image
        env:
          ISA_IMAGE: ${{ steps.tags.outputs.dockerfile }}
        run: |
          if docker pull "$ISA_IMAGE"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.available != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build ISA image when unavailable
        if: steps.image.outputs.available != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/isa/Dockerfile
          tags: ${{ steps.tags.outputs.dockerfile }}
          load: true
          push: false
          cache-from: type=gha,scope=isa-image
          cache-to: type=gha,mode=max,scope=isa-image

      - name: Run ISA golden comparison
        env:
          ISA_IMAGE: ${{ steps.tags.outputs.dockerfile }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ISA_IMAGE" \
            /opt/venv/bin/python .github/scripts/compare_with_spike.py \
              --riscv-tests /opt/riscv-tests \
              --suites rv32ui,rv32um,rv32ua,rv32mi,rv32si \
              --report .github/artifacts/isa/compare_report.json

      - name: Run riscv-arch-test golden comparison
        env:
          ISA_IMAGE: ${{ steps.tags.outputs.dockerfile }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ISA_IMAGE" \
            /opt/venv/bin/python .github/scripts/compare_with_spike.py \
              --arch-test /opt/riscv-arch-test \
              --report .github/artifacts/isa/arch_compare_report.json

      - name: Run ISA golden comparison under each core configuration
        env:
          ISA_IMAGE: ${{ steps.tags.outputs.dockerfile }}
        run: |
          failed=""
          # Keep equal to MATRIX in tests/core_configs.py.
          for config in no_caches one_way long_lines one_mshr small_buffers; do
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              "$ISA_IMAGE" \
              /opt/venv/bin/python .github/scripts/compare_with_spike.py \
                --riscv-tests /opt/riscv-tests \
                --suites rv32ui,rv32um,rv32ua,rv32mi,rv32si \
                --mem-latency 2 --config "$config" \
                --report ".github/artifacts/isa/compare_report_$config.json" \
              || failed="$failed $config"
          done
          if [ -n "$failed" ]; then
            echo "::error::riscv-tests failed under:$failed"
            exit 1
          fi

      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ISA_IMAGE: ${{ steps.tags.outputs.dockerfile }}
          IMMUTABLE_IMAGE: ${{ steps.tags.outputs.immutable }}
          LINUX_IMAGE: ${{ steps.tags.outputs.linux }}
        run: |
          docker tag "$ISA_IMAGE" "$IMMUTABLE_IMAGE"
          docker tag "$ISA_IMAGE" "$LINUX_IMAGE"
          docker push "$ISA_IMAGE"
          docker push "$IMMUTABLE_IMAGE"
          docker push "$LINUX_IMAGE"

      - name: Upload compare report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isa-golden-report
          path: |
            .github/artifacts/isa/compare_report.json
            .github/artifacts/isa/arch_compare_report.json
            .github/artifacts/isa/compare_report_*.json
          if-no-files-found: error
