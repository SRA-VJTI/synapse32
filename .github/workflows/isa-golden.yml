name: ISA Golden (Spike vs Verilator)

on:
  push:
    paths:
      - "rtl/**"
      - "tests/**"
      - ".github/scripts/**"
      - ".github/workflows/isa-golden.yml"
  pull_request:
    paths:
      - "rtl/**"
      - "tests/**"
      - ".github/scripts/**"
      - ".github/workflows/isa-golden.yml"
  workflow_dispatch:
    inputs:
      test_limit:
        description: "Limit number of riscv-tests to run (0 = all)"
        required: false
        default: "0"
      max_cycles:
        description: "Max Verilator cycles per ISA test"
        required: false
        default: "200000"

jobs:
  spike-golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RISCV: /usr
      SPIKE_PREFIX: ${{ github.workspace }}/.cache/spike-install
      RISCV_TESTS_DIR: ${{ github.workspace }}/.cache/riscv-tests
      RISCV_TEST_SUITES: rv32ui rv32um rv32ua rv32mi rv32si
      # Suites that also define -v- variants (S-mode under Sv32 paging).
      RISCV_TEST_VM_SUITES: rv32ui rv32um rv32ua
      TEST_LIMIT: ${{ github.event.inputs.test_limit || '0' }}
      MAX_CYCLES: ${{ github.event.inputs.max_cycles || '200000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autotools-dev \
            bc \
            binutils-riscv64-unknown-elf \
            bison \
            build-essential \
            cmake \
            device-tree-compiler \
            flex \
            gawk \
            gcc-riscv64-unknown-elf \
            gperf \
            libboost-filesystem-dev \
            libboost-regex-dev \
            libboost-system-dev \
            libexpat1-dev \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtool \
            ninja-build \
            patchutils \
            picolibc-riscv64-unknown-elf \
            python3 \
            python3-venv \
            texinfo \
            verilator \
            zlib1g-dev

      - name: Build and install Spike
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/riscv-isa-sim
          mkdir -p /tmp/riscv-isa-sim/build
          cd /tmp/riscv-isa-sim/build
          ../configure --prefix="$SPIKE_PREFIX"
          make -j"$(nproc)"
          make install
          echo "$SPIKE_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Build riscv-tests
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/riscv-software-src/riscv-tests.git "$RISCV_TESTS_DIR"
          cd "$RISCV_TESTS_DIR"
          autoconf
          ./configure --prefix="$RISCV_TESTS_DIR/install"
          cd isa
          mapfile -t targets < <(
            for suite in $RISCV_TEST_SUITES; do
              for f in "$suite"/*.S; do
                d="$(dirname "$f")"
                b="$(basename "$f" .S)"
                echo "${d}-p-${b}"
              done
            done
            for suite in $RISCV_TEST_VM_SUITES; do
              for f in "$suite"/*.S; do
                d="$(dirname "$f")"
                b="$(basename "$f" .S)"
                echo "${d}-v-${b}"
              done
            done
          )
          printf 'Building %d riscv-tests targets:\n' "${#targets[@]}"
          printf '  %s\n' "${targets[@]}" | sort
          # Ubuntu installs picolibc headers outside GCC's default search path.
          # The -v- runtime provides its own libc functions, but needs the headers.
          picolibc_include=/usr/lib/picolibc/riscv64-unknown-elf/include
          test -f "$picolibc_include/string.h"
          make -j"$(nproc)" XLEN=32 \
            RISCV_GCC="riscv64-unknown-elf-gcc -isystem $picolibc_include" \
            "${targets[@]}"
          ls -1 rv32mi-p-* rv32si-p-* rv32ui-v-* > /dev/null

      - name: Verify tools
        run: |
          verilator --version
          riscv64-unknown-elf-gcc --version | head -n 1
          spike --help | head -n 5

      - name: Set up Python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r tests/requirements.txt

      - name: Compare Spike vs Verilator on riscv-tests
        run: |
          .venv/bin/python .github/scripts/compare_with_spike.py \
            --riscv-tests "$RISCV_TESTS_DIR" \
            --limit "$TEST_LIMIT" \
            --max-cycles "$MAX_CYCLES" \
            --suites "${RISCV_TEST_SUITES// /,}"

      - name: Upload compare report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isa-golden-report
          path: .github/artifacts/isa/compare_report.json
          if-no-files-found: error
