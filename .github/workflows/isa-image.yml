name: Publish ISA image

# Runs after the ISA comparisons on main, in its own workflow so pull requests show no skipped publish job.
on:
  workflow_run:
    workflows: ["ISA Golden Image"]
    types: [completed]
    branches: [main]

concurrency:
  group: isa-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # The branches filter matches a branch name, so a pull request from a fork's main would match it too.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      # The commit that was tested, so the tag below is the one the comparisons used.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Rebuilt from the BuildKit cache the tested image was built from.
      - id: image
        uses: ./.github/actions/image
        with:
          tag: ghcr.io/sra-vjti/synapse32-isa:dockerfile-${{ hashFiles('.github/isa/Dockerfile', 'tests/requirements.txt') }}
          context: .
          file: .github/isa/Dockerfile
          cache-scope: isa-image
      - if: steps.image.outputs.published != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker push "$IMAGE"
